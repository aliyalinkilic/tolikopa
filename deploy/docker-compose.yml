# Named volumes are prefixed with the project name. An installation created under an
# older project name keeps its data by setting COMPOSE_PROJECT_NAME in .env (it takes
# precedence over this line) — see docs/UPGRADING.md.
name: tolikopa

# Three services. DB and API ports are NOT published to the host — only Caddy (web)
# is reachable from the LAN, on 443. Run from this directory: `docker compose up -d --build`.

services:
  db:
    # Tag for humans, digest is what Docker pulls (docker buildx imagetools inspect <tag>).
    image: timescale/timescaledb:2.27.0-pg17@sha256:c2b230fd8343c713c6003d17d18b00237674532794372a44fe845d4ec3121f65
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tolikopa}
      POSTGRES_DB: ${POSTGRES_DB:-tolikopa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: ${TZ:-Europe/Istanbul}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tolikopa} -d ${POSTGRES_DB:-tolikopa}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # The postgres entrypoint starts as root, chowns the data dir and drops to the
    # postgres user (gosu: setuid syscalls, no setuid binary), so it keeps Docker's
    # default capabilities; no-new-privileges still blocks setuid/file-cap gains.
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  api:
    build:
      context: ..                 # repo root: also compiles agent/ and setup/ (see the Dockerfile)
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-tolikopa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tolikopa}?sslmode=disable"
      LISTEN_ADDR: ":8080"
      INGEST_TOKEN: ${INGEST_TOKEN:?INGEST_TOKEN is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # First run: the panel asks for this one-time code before it lets anyone create
      # the first admin account. Empty = the API generates one and prints it to its log.
      SETUP_CODE: ${SETUP_CODE:-}
      # Optional legacy seeding of the first admin (installations created before the
      # setup wizard). Leave unset on new installs.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # The panel's TLS CERTIFICATE only (never the key): it goes into the agents'
      # config.json and into the setup tool's bundle (tolikopa-setup.zip).
      TLS_CERT_FILE: /tls/tolikopa.crt
      SERVER_HOST: ${SERVER_HOST:-localhost}
      OFFLINE_WARN_SEC: ${OFFLINE_WARN_SEC:-300}
      OFFLINE_CRIT_SEC: ${OFFLINE_CRIT_SEC:-1800}
      # Optional e-mail notifications (disabled unless SMTP_ENABLED=true)
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      TZ: ${TZ:-Europe/Istanbul}
    volumes:
      # create_host_path: false — a missing file is an error, not an empty directory.
      - type: bind
        source: ./tls/tolikopa.crt
        target: /tls/tolikopa.crt
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Runs as 65534 and needs no capability at all.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  web:
    build:
      context: ..                 # repo root: needs web/ and deploy/caddy/Caddyfile
      dockerfile: web/Dockerfile
    environment:
      # SERVER_HOST: the site addresses ("tolikopa.corp.local 10.0.0.10");
      # DEFAULT_SNI: the name whose certificate a client without SNI gets.
      SERVER_HOST: ${SERVER_HOST:-localhost}
      DEFAULT_SNI: ${DEFAULT_SNI:-localhost}
      TZ: ${TZ:-Europe/Istanbul}
    # Docker publishes these with its own iptables rules, which take effect BEFORE
    # ufw: a ufw rule does not restrict them. To listen on one interface only, set
    # BIND_ADDR in .env to that interface's IP. Unset = plain "443:443" (all IPv4
    # and IPv6 addresses, exactly as before).
    ports:
      - "${BIND_ADDR:+${BIND_ADDR}:}80:80"
      - "${BIND_ADDR:+${BIND_ADDR}:}443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # Certificate + private key from setup.sh. Only this container sees the key.
      - type: bind
        source: ./tls
        target: /etc/caddy/tls
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - api
    # Caddy runs as root inside the container only to bind 80/443: every other
    # capability is dropped. It reads the key as its owner (root, mode 600), which
    # needs no CAP_DAC_OVERRIDE.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
